<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cờ Cá Ngựa</title>
<link rel="icon" href="icon_2.ico">
<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>

  <!-- ============ LOADING ============ -->
  <section id="screen-loading" class="screen active"><div class="loading-spinner"></div></section>

  <!-- ============ LOBBY ============ -->
  <section id="screen-lobby" class="screen">
    <div class="lobby-card">
      <select class="lang-select lobby-lang" id="lang-select-lobby" aria-label="Language"></select>
      <div class="lobby-dice">⚀ ⚅</div>
      <h1 class="lobby-title" id="lobby-title"></h1>
      <p class="lobby-sub" id="lobby-sub"></p>

      <label for="input-name" id="lbl-name"></label>
      <input type="text" id="input-name" maxlength="16">

      <div class="tabs">
        <button class="tab-btn active" data-tab="create" id="tab-btn-create"></button>
        <button class="tab-btn" data-tab="join" id="tab-btn-join"></button>
        <button class="tab-btn" data-tab="offline" id="tab-btn-offline"></button>
      </div>

      <div class="tab-panel active" id="tab-create">
        <button class="btn btn-block sfx-hover" id="btn-create-room"></button>
      </div>
      <div class="tab-panel" id="tab-join">
        <label for="input-room-code" id="lbl-code"></label>
        <input type="text" id="input-room-code" maxlength="5" style="text-transform:uppercase">
        <button class="btn btn-block sfx-hover" id="btn-join-room"></button>
      </div>
      <div class="tab-panel" id="tab-offline">
        <p class="muted" id="offline-hint" style="font-size:.9rem;"></p>
        <button class="btn btn-block sfx-hover" id="btn-start-offline"></button>
      </div>
      <p class="muted" id="online-off-note" style="display:none;font-size:.82rem;text-align:center;"></p>
    </div>
  </section>

  <!-- ============ WAITING ROOM ============ -->
  <section id="screen-waiting" class="screen">
    <div class="waiting-card">
      <div class="room-code-box" id="room-code-box">
        <div class="label" id="room-code-label"></div>
        <div class="code" id="room-code-display">-----</div>
      </div>
      <h3 id="seats-title"></h3>
      <div id="seat-grid" class="seat-grid"></div>

      <div class="house-rules-box">
        <h3 id="rules-title"></h3>
        <div id="rules-list"></div>
        <p id="rules-readonly-hint" class="muted" style="font-size:.8rem;"></p>
      </div>

      <button class="btn btn-block" id="btn-start-game"></button>
      <p id="waiting-hint" class="muted" style="text-align:center;"></p>
      <button class="btn btn-secondary btn-block" id="btn-leave-waiting"></button>
    </div>
  </section>

  <!-- ============ GAME ============ -->
  <section id="screen-game" class="screen">
    <div class="game-header">
      <h2>🎲 <span id="game-title"></span> <span class="room-chip" id="game-room-code-label"></span> <span class="status-badge" id="spectator-badge" style="display:none;"></span></h2>
      <div class="header-actions">
        <button class="icon-btn" id="btn-rules" type="button"></button>
        <button class="icon-btn" id="btn-sound" type="button">🔊</button>
        <select class="lang-select" id="lang-select-game" aria-label="Language"></select>
        <button class="icon-btn" id="btn-leave-game" type="button"></button>
      </div>
    </div>
    <div class="game-body">
      <div class="board-wrap" id="board-wrap">
        <div id="board"></div>
      </div>
      <div class="side-panel">
        <div id="turn-banner" class="turn-banner"></div>
        <div class="dice-area">
          <button type="button" class="die-btn" id="die-btn" aria-label="Roll"><div class="die" id="die"></div></button>
          <button type="button" class="btn" id="btn-roll"></button>
        </div>
        <div id="player-panel"></div>
        <div class="log-wrap"><div id="log-panel"></div></div>
      </div>
    </div>
  </section>

  <div id="modal"></div>
  <div id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js?v=1"></script>
  <script src="js/i18n.js?v=1"></script>
  <script src="js/sounds.js?v=1"></script>
  <script src="js/ludo-engine.js?v=1"></script>
  <script src="js/ludo-net.js?v=1"></script>
  <script src="js/ludo-ui.js?v=1"></script>
</body>
</html>
